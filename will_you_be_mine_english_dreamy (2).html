<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Will You Be Mine? ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#b9a7ff;--accent2:#79d8ff;--light:#e8e1ff;--soft:#b8ecff}
body{min-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"DM Sans",sans-serif;background:radial-gradient(circle at 18% 20%,rgba(121,216,255,.18),transparent 28%),radial-gradient(circle at 82% 75%,rgba(185,167,255,.20),transparent 30%),linear-gradient(135deg,#060815,#10132b 48%,#17102b)}
.stars{position:fixed;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 3s infinite ease-in-out}@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1.5)}}
.moon{position:fixed;top:8%;right:9%;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e7e0ff 60%,#a8ddff);box-shadow:0 0 45px rgba(170,205,255,.45);animation:moonFloat 5s ease-in-out infinite}@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.glow{position:fixed;width:350px;height:350px;border-radius:50%;filter:blur(90px);pointer-events:none}.one{left:-180px;bottom:-120px;background:rgba(80,180,255,.10)}.two{right:-180px;top:45%;background:rgba(180,120,255,.10)}
.container{position:relative;z-index:10;width:92%;max-width:470px;text-align:center;animation:pageIn 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes pageIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:none}}
.music{position:fixed;right:20px;top:20px;z-index:9999;width:45px;height:45px;border-radius:50%;border:1px solid rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.07);backdrop-filter:blur(10px);cursor:pointer;font-size:18px}
.eyebrow{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:18px}
.title{font-family:"Cormorant Garamond",serif;font-size:clamp(55px,16vw,82px);font-weight:500;line-height:.88;letter-spacing:-2px;margin-bottom:20px}.title span{color:var(--light);font-style:italic;text-shadow:0 0 35px rgba(150,190,255,.28)}
.subtitle{max-width:330px;margin:0 auto 34px;color:rgba(255,255,255,.62);font-size:14px;line-height:1.75}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}.divider:before,.divider:after{content:"";width:55px;height:1px;background:rgba(255,255,255,.2)}.divider span{color:var(--accent2);animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.35)}}
.buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
button{min-width:145px;padding:16px 25px;border-radius:100px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.35s cubic-bezier(.2,.8,.2,1)}
#yesBtn{border:0;color:#101326;background:linear-gradient(135deg,#fff,#c8f0ff);box-shadow:0 12px 35px rgba(110,200,255,.18)}#yesBtn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 18px 45px rgba(110,200,255,.35)}
#noBtn{color:rgba(255,255,255,.8);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15)}#noBtn:hover{background:rgba(255,255,255,.09);transform:translateY(-3px)}
.note{margin-top:22px;font-size:11px;color:rgba(255,255,255,.32)}
#result{display:none;animation:resultIn .9s cubic-bezier(.2,.8,.2,1)}@keyframes resultIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
.result-icon{font-size:58px;margin-bottom:20px;animation:floating 2.5s ease-in-out infinite}@keyframes floating{50%{transform:translateY(-9px)}}
.result-title{font-family:"Cormorant Garamond",serif;font-size:48px;font-weight:500;line-height:1;margin-bottom:22px}.result-title em{color:var(--light)}
.result-text{color:rgba(255,255,255,.7);font-size:14px;line-height:1.8;margin-bottom:28px}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 27px;border-radius:100px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#25D366,#1ebd5a);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(37,211,102,.2);transition:.3s}.wa:hover{transform:translateY(-4px)}
.secondary{display:inline-flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.20);font-size:13px;min-width:220px}
.confetti{position:fixed;top:-30px;z-index:999;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}
.burst{position:fixed;left:50%;top:50%;z-index:998;pointer-events:none;animation:burst 1.8s ease-out forwards}@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(var(--r));opacity:0}}
#openingPage{display:block}
.opening-heart{width:92px;height:92px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(185,167,255,.42);border-radius:50%;color:#d8d0ff;font-family:"Cormorant Garamond",serif;font-size:55px;box-shadow:0 0 45px rgba(130,190,255,.18);animation:openingPulse 2.4s ease-in-out infinite}
@keyframes openingPulse{0%,100%{transform:scale(1);box-shadow:0 0 25px rgba(255,111,159,.12)}50%{transform:scale(1.08);box-shadow:0 0 50px rgba(255,111,159,.28)}}
.opening-title{font-family:"Cormorant Garamond",serif;font-size:clamp(48px,14vw,72px);line-height:.86;font-weight:500;letter-spacing:-1px;margin-bottom:22px}
.opening-title em{color:#c8f0ff}
.opening-btn{border:1px solid rgba(255,255,255,.18)!important}
#questionPage{display:none}


#sceneObjects{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.scene-object{position:absolute;left:50%;top:50%;font-size:clamp(34px,10vw,76px);filter:drop-shadow(0 12px 28px rgba(0,0,0,.2));opacity:0;will-change:transform,opacity}
.scene-object.float{animation:objectFloat 5s ease-in-out infinite}
@keyframes objectFloat{
  0%,100%{transform:translate3d(var(--x),var(--y),0) rotate(var(--r))}
  50%{transform:translate3d(var(--x),calc(var(--y) - 18px),0) rotate(calc(var(--r) + 7deg))}
}
.scene-object.drift{animation:objectDrift 8s ease-in-out infinite}
@keyframes objectDrift{
  0%,100%{transform:translate3d(var(--x),var(--y),0) rotate(var(--r));opacity:.5}
  50%{transform:translate3d(calc(var(--x) + 25px),calc(var(--y) - 30px),0) rotate(calc(var(--r) - 10deg));opacity:.8}
}
.scene-object.pop{animation:objectPop .7s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes objectPop{
  0%{opacity:0;transform:translate3d(var(--x),var(--y),0) scale(.2) rotate(-20deg)}
  70%{opacity:.8;transform:translate3d(var(--x),var(--y),0) scale(1.12) rotate(8deg)}
  100%{opacity:.55;transform:translate3d(var(--x),var(--y),0) scale(1) rotate(0)}
}
#sceneObjects.yes-scene:after{
  content:"";position:absolute;left:50%;top:50%;width:35vw;height:35vw;max-width:330px;max-height:330px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(120,190,255,.16),transparent 68%);
  filter:blur(12px);animation:sceneGlow 3s ease-in-out infinite;
}
#sceneObjects.no-scene:after{
  content:"";position:absolute;left:50%;top:55%;width:40vw;height:30vw;max-width:380px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(160,150,220,.10),transparent 70%);
  filter:blur(20px);animation:sceneGlow 4s ease-in-out infinite;
}
@keyframes sceneGlow{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.6}}

@media(max-width:600px){.moon{width:58px;height:58px;top:6%;right:7%}.title{font-size:clamp(52px,18vw,72px)}.subtitle{font-size:13px;max-width:290px}.buttons{flex-direction:column;align-items:center}button{width:80%;max-width:280px}.result-title{font-size:42px}.result-text{font-size:13px}}
</style>
</head>
<body>

<audio id="introMusic" src="Perfection _ Sempurna English Version - BBIBEEB.mp3" preload="auto" loop></audio>

<button class="music" id="musicBtn" onclick="toggleMusic()" aria-label="Mute or unmute">🔇</button>

<div class="stars">
<div class="star" style="left:8%;top:15%;animation-delay:.2s"></div><div class="star" style="left:18%;top:30%;animation-delay:1s"></div><div class="star" style="left:27%;top:10%;animation-delay:1.7s"></div><div class="star" style="left:39%;top:22%;animation-delay:.5s"></div><div class="star" style="left:51%;top:8%;animation-delay:2s"></div><div class="star" style="left:62%;top:29%;animation-delay:1.3s"></div><div class="star" style="left:72%;top:16%;animation-delay:.8s"></div><div class="star" style="left:84%;top:34%;animation-delay:2.2s"></div><div class="star" style="left:94%;top:12%;animation-delay:1.5s"></div>
<div class="star" style="left:12%;top:70%;animation-delay:1.1s"></div><div class="star" style="left:24%;top:82%;animation-delay:2.4s"></div><div class="star" style="left:46%;top:75%;animation-delay:.6s"></div><div class="star" style="left:69%;top:83%;animation-delay:1.8s"></div><div class="star" style="left:88%;top:68%;animation-delay:.3s"></div>
</div>
<div class="moon"></div><div class="glow one"></div><div class="glow two"></div>

<div id="sceneObjects" aria-hidden="true"></div>
<main class="container">

<section id="openingPage">
  <div class="eyebrow">A little moment</div>
  <div class="opening-heart">♡</div>
  <h1 class="opening-title">I have<br><em>something</em><br>to ask you.</h1>
  <p class="subtitle">Take a little breath first.<br>And when you're ready...</p>
  <button class="secondary opening-btn" onclick="startExperience()">Enter the moment ✦</button>
  <p class="note">a little moment is waiting for you.</p>
</section>

<section id="questionPage">
<div class="eyebrow">One little question</div>
<h1 class="title">Will You<br><span>Be Mine?</span></h1>
<p class="subtitle">I've been keeping this question in my heart for a while.<br>Maybe it's time I finally ask.</p>
<div class="divider"><span>♡</span></div>
<div class="buttons">
<button id="yesBtn" onclick="directYes()">YES, I WILL ♡</button>
<button id="noBtn" onclick="sayNo()">NO</button>
</div>
<p class="note">take your time...</p>
</section>
<section id="result"></section>
</main>

<script>
const INTRO_FILE="Perfection _ Sempurna English Version - BBIBEEB.mp3";
const introMusic=document.getElementById("introMusic");
const musicBtn=document.getElementById("musicBtn");
const questionPage=document.getElementById("questionPage");
const result=document.getElementById("result");
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
let noCount=0, muted=false;

introMusic.volume=.5;

function playMusic(){
  introMusic.muted=muted;
  introMusic.play().then(()=>{
    musicBtn.textContent=muted?"🔇":"🔊";
  }).catch(()=>{
    musicBtn.textContent="🔇";
  });
}

function toggleMusic(){
  muted=!muted;
  introMusic.muted=muted;
  if(!muted) introMusic.play().catch(()=>{});
  musicBtn.textContent=muted?"🔇":"🔊";
}

let introStarted=false;

function startIntro(){
  if(introStarted) return;
  introStarted=true;
  playMusic();
}

document.addEventListener("pointerdown", startIntro, {once:true});


const sceneObjects=document.getElementById("sceneObjects");

function clearScene(){
  sceneObjects.className="";
  sceneObjects.innerHTML="";
}

function makeScene(type){
  clearScene();
  sceneObjects.classList.add(type==="yes"?"yes-scene":"no-scene");

  const yesObjects=["✦","✧","☾","🪐","✨","☁️","🌙","💫"];
  const noObjects=["☁️","⋆","☾","🌧️","✧","🫧","🌙","💭"];
  const objects=type==="yes"?yesObjects:noObjects;

  objects.forEach((emoji,i)=>{
    const el=document.createElement("div");
    el.className="scene-object "+(i%2?"drift":"float");
    el.textContent=emoji;

    const positions=[
      [-38,-31],[-10,-37],[27,-28],[-43,2],[37,5],
      [-27,31],[8,34],[31,29]
    ];
    const [x,y]=positions[i];

    el.style.setProperty("--x",`calc(${x}vw - 50%)`);
    el.style.setProperty("--y",`calc(${y}vh - 50%)`);
    el.style.setProperty("--r",`${(i%2?1:-1)*(8+i*3)}deg`);
    el.style.animationDelay=`${i*.22}s`;

    sceneObjects.appendChild(el);
    requestAnimationFrame(()=>el.style.opacity=type==="yes"?.55:.38);
  });
}

function transitionScene(type){
  clearScene();
  setTimeout(()=>makeScene(type),120);
}

function startExperience(){
  const opening=document.getElementById("openingPage");
  opening.style.animation="resultIn .45s ease reverse";
  setTimeout(()=>{
    opening.style.display="none";
    questionPage.style.display="block";
    makeScene("yes");
    playMusic();
  },350);
}

function sayNo(){
  noCount++;
  if(noCount===1){noBtn.textContent="Are you sure?";yesBtn.style.transform="scale(1.08)";return}
  if(noCount===2){noBtn.textContent="Really? 🥺";yesBtn.style.transform="scale(1.13)";return}
  showFriendEnding();
}

function directYes(){
  playMusic();
  transitionScene("yes");
  questionPage.style.display="none";
  result.style.display="block";
  result.innerHTML=`
  <div class="result-icon">💗</div>
  <h2 class="result-title">I knew you'd say <em>yes.</em></h2>
  <p class="result-text">
  Okay... I'm officially smiling like an idiot right now. 😭<br><br>
  Thank you for choosing me.<br><br>
  I don't know exactly where this story will take us,<br>
  but I know one thing...<br><br>
  <b>I want to find out with you. ❤️</b><br><br>
  Let's make random memories, laugh at stupid things,
  talk about everything and nothing, and make the ordinary
  days feel a little more special.<br><br>
  <b>Will you let me be your person? 🫶</b>
  </p>
  <a class="wa" href="https://wa.me/6285804009865?text=YES.%20I'll%20be%20yours.%20%F0%9F%92%97" target="_blank">💬 Let's Talk</a>
  <p class="note">maybe this is where our story begins. ✦</p>`;
  createConfetti(150);createHeartBurst(30);
}

function showFriendEnding(){
  playMusic();
  transitionScene("no");
  questionPage.style.display="none";
  result.style.display="block";
  result.innerHTML=`
  <div class="result-icon">🥀</div>
  <h2 class="result-title">Okay...<br><em>I'll understand.</em></h2>
  <p class="result-text">
  Maybe I was a little too hopeful.<br><br>
  I won't force you to feel something you don't feel.<br><br>
  So... <b>let's just be friends.</b><br><br>
  I'll still be here to listen to your stories, laugh at your jokes,
  and annoy you from time to time. :)<br><br>
  Maybe someday I'll stop hoping for something more.<br><br>
  But for now...<br><i>I'll just quietly wish the best for you.</i><br><br>
  And if you ever change your mind...<br><br>
  <b>you know where to find me. ♡</b>
  </p>
  <button type="button" class="secondary" id="changeMindBtn" onclick="changeMind()">Wait... I changed my mind 🥺</button>
  <p class="note">some decisions deserve a second thought.</p>`;
}

function changeMind(){
  result.style.display="block";
  questionPage.style.display="none";
  playMusic();
  transitionScene("yes");
  result.innerHTML=`
  <div class="result-icon">🥹</div>
  <h2 class="result-title">You came <em>back.</em></h2>
  <p class="result-text">
  For a moment, I thought that was it.<br><br>
  I thought I'd have to smile, pretend everything was okay,
  and quietly move on.<br><br>
  But then... <b>you came back. 🥹</b><br><br>
  Maybe you needed a little time to realize what your heart wanted.<br><br>
  And honestly? I'm really glad it led you back here.<br><br>
  So let's forget that little "NO" ever happened. 😂<br><br>
  <b>Let's write something beautiful together. ❤️</b><br><br>
  No pressure. No pretending.<br>
  Just you and me, taking it one day at a time.
  </p>
  <a class="wa" href="https://wa.me/6285804009865?text=Okay...%20I%20changed%20my%20mind.%20I%20want%20to%20be%20yours.%20%F0%9F%92%97" target="_blank">💬 Tell You Personally</a>
  <p class="note">this time, I'm not letting you disappear again. ♡</p>`;
  createConfetti(180);createHeartBurst(35);
}

function createConfetti(amount){
  const emojis=["✦","✧","✨","☾","🫧","⋆","💫","☁️"];
  for(let i=0;i<amount;i++){
    const e=document.createElement("div");
    e.className="confetti";
    e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.fontSize=(Math.random()*17+10)+"px";
    e.style.animationDuration=(Math.random()*3+2)+"s";
    e.style.animationDelay=(Math.random()*1.2)+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),7000);
  }
}

function createHeartBurst(amount){
  const hearts=["✦","✧","✨","☾","⋆"];
  for(let i=0;i<amount;i++){
    const e=document.createElement("div");
    e.className="burst";
    e.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    const a=Math.random()*Math.PI*2,d=Math.random()*250+100;
    e.style.setProperty("--x",Math.cos(a)*d+"px");
    e.style.setProperty("--y",Math.sin(a)*d+"px");
    e.style.setProperty("--r",Math.random()*360+"deg");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),2000);
  }
}
</script>
</body>
</html>
